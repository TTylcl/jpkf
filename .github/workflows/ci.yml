name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 只装跑 Prompt 安全测试所需的最小依赖，避免拉全量 LangChain 重依赖
          pip install pytest pytest-asyncio sqlalchemy pydantic asyncpg flake8

      - name: Prompt safety tests
        run: pytest test/test_prompt_safety.py -v

      - name: Lint (fatal errors only)
        run: flake8 core agent api service dal schemas --count --select=E9,F63,F7,F82 --show-source --statistics
