[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system"
version = "0.1.0"
description = "基于 LangGraph 的多模态教育客服智能体系统"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [
    {name = "AI Agent Team", email = "example@example.com"}
]
keywords = ["ai", "langgraph", "education", "agent", "fastapi", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# 核心依赖（严格对应你的技术栈）
dependencies = [
    # LangChain 生态（你指定 LangChain==1.2.14，其他 AI 相关用最新）
    "langchain==1.2.14",
    "langchain-core==1.2.25",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.12",
    "langgraph>=0.2.0",  # 新增：你指定的核心架构
    
    # Web 框架
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "websockets==12.0",
    # 认证（JWT）
    "pyjwt==2.10.1",
    
    # 数据库（PostgreSQL+pgvector）
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.23",
    
    # 配置管理
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.13.1",
    
    # 日志（你要求的标准配置）
    "loguru==0.7.3",
    "python-json-logger==2.0.7",
    
    # 后台任务调度（消课模块：每分钟扫描排课生成待办）
    "apscheduler>=3.10.0",
]

# 可选依赖组
[project.optional-dependencies]
dev = [
    # 测试
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.3",
    
    # 代码质量
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.8.0",
]

test = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.3",
]

lint = [
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.8.0",
]

# 入口点配置
[project.scripts]
ai-agent-emotion = "main:app"

# 工具配置
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agent*", "api*", "service*", "dal*", "schemas*", "infrastructure*", "utils*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning",
]
testpaths = ["test/dal", "test/service"]
asyncio_mode = "auto"  
asyncio_default_fixture_loop_scope = "session"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

